[workspace]
resolver = "3"
members = ["contracts/machine", "contracts/nft", "contracts/factory", "contracts/mock-usdt"]
# Sandbox tests run separately (the NEAR sandbox node has no Windows build): see tests/sandbox/README.md
exclude = ["tests/sandbox"]

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
uint = { version = "0.10.2", default-features = false }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true
